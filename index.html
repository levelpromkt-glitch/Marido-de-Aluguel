<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lovable MVP</title>
    <!-- Phosphor Icons for modern UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- CSS Animated Gradient Background (Lovable Style) -->
    <div class="bg-gradient-container">
      <div class="bg-blob bg-blue-left"></div>
      <div class="bg-blob bg-blue-right"></div>
      <div class="bg-blob bg-pink-bottom"></div>
      <div class="bg-dark-center"></div>
    </div>

    <!-- UI Overlay -->
    <div id="app">
      <header>
        <div class="logo-container">
          <i class="ph-fill ph-heart" style="color: #ff4757; font-size: 1.5rem;"></i>
          <span>Lovable</span>
        </div>
      </header>

      <main class="hero">
        <div class="badge-pill">
          <span class="badge-new">Novo</span>
          <span>Aplicativos adoráveis agora funcionam no ChatGPT e no Claude.</span>
          <i class="ph ph-arrow-right"></i>
        </div>

        <h1 class="hero-title">Pronto para construir, Karol?</h1>
        
        <div class="input-card">
          <textarea class="hero-textarea" placeholder="Ask Lovable to create an internal tool that..." rows="3"></textarea>
          
          <div class="input-actions">
            <button class="icon-btn action-left">
              <i class="ph ph-plus" style="font-size: 1.2rem;"></i>
            </button>
            <div class="actions-right">
              <button class="build-btn">
                Plano <i class="ph ph-caret-down" style="font-size: 0.8rem;"></i>
              </button>
              <button class="icon-btn">
                <i class="ph ph-microphone" style="font-size: 1.2rem;"></i>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
