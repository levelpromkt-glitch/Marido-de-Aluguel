<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MVP SaaS - Construa com IA</title>
    <!-- Phosphor Icons for modern UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ThreeJS Canvas -->
    <div id="webgl-container"></div>

    <!-- UI Overlay -->
    <div id="app">
      <header>
        <div class="logo-container">
          <i class="ph-fill ph-heart" style="color: #ff4757; font-size: 1.5rem;"></i>
          <span>Lovable MVP</span>
        </div>
        <ul class="nav-links">
          <li>Soluções <i class="ph ph-caret-down" style="font-size: 0.8rem; opacity: 0.7;"></i></li>
          <li>Recursos <i class="ph ph-caret-down" style="font-size: 0.8rem; opacity: 0.7;"></i></li>
          <li>Comunidade</li>
          <li>Empresas</li>
          <li>Preços</li>
          <li>Segurança</li>
        </ul>
        <div class="header-actions">
          <button class="btn btn-secondary">Entrar</button>
          <button class="btn btn-primary">Começar</button>
        </div>
      </header>

      <main class="hero">
        <h1>Crie algo com a IA</h1>
        <p>Crie apps e sites conversando com a IA</p>
        
        <div class="input-container">
          <button class="icon-btn">
            <i class="ph ph-plus" style="font-size: 1.1rem;"></i>
          </button>
          <input type="text" class="hero-input" placeholder="Peça à IA para criar um blog sobre..." />
          <button class="build-btn">
            Construir <i class="ph ph-caret-down" style="font-size: 0.8rem;"></i>
          </button>
          <button class="icon-btn" style="background: transparent; border: none; padding-left: 0.5rem; color: var(--text-secondary);">
            <i class="ph ph-microphone" style="font-size: 1.2rem;"></i>
          </button>
        </div>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
